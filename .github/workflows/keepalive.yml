name: Tieni attivo il salvataggio online

# A free Supabase project is paused after a week without use. Twice a week this calls ping() (see
# supabase/migrations/0001_account.sql), which reads nothing: enough to count as use. The key is the public one, the
# same the app carries.
on:
  schedule:
    - cron: '0 7 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            -X POST 'https://krfhynrhictmtolqkpas.supabase.co/rest/v1/rpc/ping' \
            -H 'apikey: sb_publishable_H-jhJDdrTnyGjSAQTsadNA_LohmE4FN' \
            -H 'Content-Type: application/json' \
            -d '{}'
