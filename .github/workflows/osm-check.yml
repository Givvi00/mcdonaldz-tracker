name: Controllo elenco con OpenStreetMap

# Every Monday: compares the restaurant list with OpenStreetMap and, if something may have opened or closed, opens
# (or comments on) an issue. Report only: the list is never changed here, see docs/AGGIORNAMENTO-DATI.md.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: osm-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - id: check
        name: Confronto con OpenStreetMap
        run: npm run osm-check

      - name: Salva quello che ha imparato (senza ripubblicare il sito)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/data/osm-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Controllo OpenStreetMap: aggiorna lo stato [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Segnalazione
        if: steps.check.outputs.findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create osm-check --color 0E8A16 --description "Controllo settimanale con OpenStreetMap" 2>/dev/null || true
          num=$(gh issue list --label osm-check --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file osm-report.md
          else
            gh issue create --title "Elenco McDonald's: novità da OpenStreetMap" --label osm-check --body-file osm-report.md
          fi
